[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/shipping"
  to = "/policies/shipping/"
  status = 301

[[redirects]]
  from = "/returns"
  to = "/policies/returns/"
  status = 301

[[redirects]]
  from = "/privacy"
  to = "/policies/privacy/"
  status = 301

[[redirects]]
  from = "/terms"
  to = "/policies/terms/"
  status = 301
